version: '3.8'

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ZERAVYNEX  –  Production Docker Compose Stack                              ║
# ║  Services: PostgreSQL · Redis · MinIO · FastAPI · Celery Worker · Nginx     ║
# ║  Usage:    docker compose up -d --build                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

x-common-env: &common-env
  DATABASE_URL: postgresql://zeravynex:${POSTGRES_PASSWORD:-zeravynex_secure_password}@postgres:5432/zeravynex
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET_NAME: zeravynex-samples
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
  USE_CELERY: "true"
  APP_ENV: production
  LOG_LEVEL: INFO

services:
  # ── 1. PostgreSQL 16 ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zeravynex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeravynex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeravynex_secure_password}
      POSTGRES_DB: zeravynex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeravynex -d zeravynex"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeravynex-net

  # ── 2. Redis 7 (Cache + Message Broker) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zeravynex-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeravynex-net

  # ── 3. MinIO (S3-Compatible Object Storage) ───────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: zeravynex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - zeravynex-net

  # ── 4. FastAPI REST API ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zeravynex-api
    restart: unless-stopped
    environment:
      <<: *common-env
      RATE_LIMIT_UPLOADS_PER_MIN: 20
      MAX_UPLOAD_SIZE_MB: 100
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zeravynex-net

  # ── 5. Celery Analysis Workers ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zeravynex-worker
    restart: unless-stopped
    command: >
      celery -A app.core.celery_app.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      -Q default
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - zeravynex-net

  # ── 6. React Frontend (Nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: zeravynex-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - zeravynex-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  zeravynex-net:
    driver: bridge
